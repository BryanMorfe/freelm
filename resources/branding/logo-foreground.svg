<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1254" height="1254" viewBox="0 0 1254 1254" fill="none" role="img" aria-labelledby="title description">
  <title id="title">FreeLM folded F</title>
  <desc id="description">Editable vector recreation of the mint folded-ribbon FreeLM mark, on a transparent canvas. Recreated from the generated app artwork with three curved surfaces and smooth gradients.</desc>
  <defs>
